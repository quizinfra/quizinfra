<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <style>
        img:is([sizes="auto" i], [sizes^="auto," i]) {
            contain-intrinsic-size: 3000px 1500px;
        }
        /* Layout */
        body {font-family: Arial, Helvetica, sans-serif; margin:0; padding:0; background:#f5f5f5;}
        .outer-container {display:flex; justify-content:center; padding:20px;}
        .inner-wrapper {max-width:900px; width:100%; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); padding:20px;}
        .form-container {margin-bottom:20px;}
        .form-group {margin-bottom:15px; display:flex; flex-direction:column;}
        .form-group label {margin-bottom:5px; font-weight:600;}
        .form-group input, .form-group textarea {padding:8px; border:1px solid #ccc; border-radius:4px; font-size:14px;}
        .form-group textarea {resize:vertical; height:80px;}
        .button-group {display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
        .button-group button {background:#007bff; color:#fff; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-size:14px;}
        .button-group button:hover {background:#0056b3;}
        .question {border:1px solid #ddd; padding:10px; border-radius:4px; margin-bottom:10px; background:#fafafa;}
        .question h4 {margin-top:0;}
        .question input[type="text"], .question textarea {width:100%; box-sizing:border-box; }
        .answer-row {display:flex; align-items:center; gap:8px; margin-bottom:5px; }
        .answer-row label {width:1.5rem; }
        .answer-row input[type="text"] {flex:1; }
        .modal {display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5);}
        .modal-content {background:#fff; padding:20px; margin:auto; width:80%; height:80%; overflow-y:auto; border-radius:8px;}
        .modal-content button {margin-top:10px;}
        .lang-switcher {display:flex; justify-content:flex-end; margin-bottom:8px;}
        .lang-switcher select {font-size:14px; padding:4px 6px; border:1px solid #ccc; border-radius:4px; background:#fff;}
    </style>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Multiple Choice Printable Quiz Maker</title>
</head>
<body>
<noscript>
    <p style="padding:20px; font-family:Arial, sans-serif;">This quiz maker is a JavaScript application and requires JavaScript to be enabled.</p>
</noscript>
<div class="outer-container">
    <div class="inner-wrapper">
        <div>
            <main>
                <article>
                    <div>
                        <header>
                            <div class="lang-switcher" id="langSwitcher"></div>
                            <h1 data-i18n="app.title">Multiple Choice Printable Quiz Maker</h1>
                        </header>
                        <div class="form-container">
                            <div class="form-group">
                                <label for="quizTitle" data-i18n="form.quiz_title">Quiz Title</label>
                                <input id="quizTitle" placeholder="Enter quiz title" data-i18n-placeholder="form.quiz_title_placeholder" type="text">
                            </div>
                            <div class="form-group">
                                <label for="teacherName" data-i18n="form.teacher_name">Teacher's Name</label>
                                <input id="teacherName" placeholder="Enter teacher's name" data-i18n-placeholder="form.teacher_name_placeholder" type="text">
                            </div>
                            <div class="form-group">
                                <label for="instructions" data-i18n="form.instructions">Instructions</label>
                                <textarea id="instructions" placeholder="Enter instructions" data-i18n-placeholder="form.instructions_placeholder"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="quizDate" data-i18n="form.date">Date</label>
                                <input id="quizDate" placeholder="Enter date" data-i18n-placeholder="form.date_placeholder" type="text">
                            </div>
                            <div id="questionsContainer"></div>
                            <div class="button-group">
                                <button data-i18n="actions.add_question" onclick="addQuestion()">Add New Question</button>
                                <button data-i18n="actions.save_progress" onclick="saveProgress()">Save Progress</button>
                                <button data-i18n="actions.load_progress" onclick="loadProgress()">Load Progress</button>
                                <button data-i18n="actions.preview_quiz" onclick="previewQuiz()">Preview Quiz</button>
                                <button data-i18n="actions.export_quiz_data" onclick="exportQuizData()">Export Quiz Data</button>
                                <button id="importBtn" data-i18n="actions.import_quiz_data">Import Quiz Data</button>
                                <button data-i18n="actions.generate_word_document" onclick="generateWordDocument()">Generate Word Document</button>
                                <button data-i18n="actions.print_answer_sheet" onclick="printAnswerSheet()">Print Answer Sheet</button>
                                <button data-i18n="actions.shuffle_questions" onclick="shuffleQuestions()">Shuffle Questions</button>
                                <button data-i18n="actions.shuffle_answers" onclick="shuffleAnswers()">Shuffle Answers</button>
                                <button data-i18n="actions.clear_quiz" onclick="clearQuiz()">Clear Quiz</button>
                            </div>
                        </div>
                        <!-- Modal for importing data -->
                        <input id="importFileInput" onchange="handleFileImport(event)" style="display:none;" type="file">
                        <!-- Modal for previewing quiz -->
                        <div id="previewModal" class="modal">
                            <div class="modal-content">
                                <h2 data-i18n="preview.heading">Quiz Preview</h2>
                                <div id="previewContent"></div>
                                <button data-i18n="actions.close" onclick="closePreview()">Close</button>
                            </div>
                        </div>
                        <script type="module" src="./src/ui.js"></script>
                    </div>
                </article>
            </main>
        </div>
    </div>
</div>
</body>
</html>
