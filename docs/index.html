		questions.forEach((q, i) => {
			content += `
      <div>
        <h4>${t("labels.question", { n: i + 1 })}</h4>
        <p>${escapeHTML(q.text)}</p>`;
			q.answers.forEach((a, idx) => {
				content += `<p style='margin-left:20px;'>${String.fromCharCode(65 + idx)}. ${escapeHTML(a)} ${q.correctAnswers[idx] ? t("labels.correct") : ""}</p>`;
			});
			if (q.explanation) content += `<p><strong>${t("labels.explanation")}</strong> ${escapeHTML(q.explanation)}</p>`;
			content += `</div>`;
		});
		content += `</body></html>`;
		const blob = new Blob([content], { type: "application/msword" });
		const url = URL.createObjectURL(blob);
		const link = document.createElement("a");
		link.href = url;
		link.download = "answer_sheet.doc";
		document.body.appendChild(link);
		link.click();
		document.body.removeChild(link);
	}
	function shuffleQuestions() {
		for (let i = questions.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[questions[i], questions[j]] = [questions[j], questions[i]];
		}
		renderQuestions();
	}
	function shuffleAnswers() {
		questions.forEach((question) => {
			const withIdx = question.answers.map((a, i) => ({
				answer: a,
				idx: i
			}));
			for (let i = withIdx.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[withIdx[i], withIdx[j]] = [withIdx[j], withIdx[i]];
			}
			const shuffledAnswers = withIdx.map((o) => o.answer);
			const newCorrect = shuffledAnswers.map((a) => question.correctAnswers[withIdx.find((o) => o.answer === a).idx]);
			question.answers = shuffledAnswers;
			question.correctAnswers = newCorrect;
		});
		renderQuestions();
	}
	function clearQuiz() {
		questions = [];
		document.getElementById("quizTitle").value = "";
		document.getElementById("teacherName").value = "";
		document.getElementById("instructions").value = "";
		document.getElementById("quizDate").value = "";
		renderQuestions();
		notify(t("toast.cleared"));
	}
	if (typeof window !== "undefined") Object.assign(window, {
		addQuestion,
		saveProgress,
		loadProgress,
		previewQuiz,
		exportQuizData,
		importQuizData,
		generateWordDocument,
		printAnswerSheet,
		shuffleQuestions,
		shuffleAnswers,
		clearQuiz,
		handleFileImport,
		closePreview,
		removeQuestion,
		updateQuestionText,
		updateAnswer,
		updateCorrectAnswer,
		updateExplanation
	});
	if (typeof document !== "undefined") {
		const importBtn = document.getElementById("importBtn");
		if (importBtn) importBtn.addEventListener("click", importQuizData);
		initI18n();
		mountLanguageSwitcher();
	}
})();</script>
