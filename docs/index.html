	}
	function setQuizData(data) {
		document.getElementById("quizTitle").value = data.title || "";
		document.getElementById("teacherName").value = data.teacherName || "";
		document.getElementById("instructions").value = data.instructions || "";
		document.getElementById("quizDate").value = data.date || "";
		tags = data.tags ? { ...data.tags } : {};
		questions = data.questions || [];
	}
	function addQuestion() {
		const question = getVersionOrThrow(CURRENT_VERSION).blankQuestion();
		question.answers = Array.from({ length: ANSWER_ROWS_PER_QUESTION }, () => "");
		question.correctAnswers = Array.from({ length: ANSWER_ROWS_PER_QUESTION }, () => false);
		questions.push(question);
		renderQuestions();
	}
	function removeQuestion(index) {
		questions.splice(index, 1);
		renderQuestions();
	}
	function escapeHTML(str) {
		return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
	}
	function renderQuestions() {
		const container = document.getElementById("questionsContainer");
		container.innerHTML = "";
		questions.forEach((q, index) => {
			const questionDiv = document.createElement("div");
			questionDiv.className = "question";
			questionDiv.innerHTML = `
      <h4>${t(23, { n: index + 1 })}</h4>
      <div>
        <label>${t(24)}</label>
        <input type="text" value="${escapeHTML(q.text)}" oninput="updateQuestionText(${index}, this.value)">
      </div>
      ${q.answers.map((a, i) => `
        <div class="answer-row">
          <label>${String.fromCharCode(65 + i)}</label>
          <input type="text" value="${escapeHTML(a)}" oninput="updateAnswer(${index}, ${i}, this.value)">
          <input type="checkbox" ${q.correctAnswers[i] ? "checked" : ""} onchange="updateCorrectAnswer(${index}, ${i}, this.checked)">
        </div>`).join("")}
      <div>
        <label>${t(25)}</label>
        <textarea oninput="updateExplanation(${index}, this.value)">${escapeHTML(q.explanation)}</textarea>
      </div>
      <button onclick="removeQuestion(${index})">${t(26)}</button>
    `;
			container.appendChild(questionDiv);
		});
	}
	function updateQuestionText(index, value) {
		questions[index].text = value;
	}
	function updateAnswer(qIndex, aIndex, value) {
		questions[qIndex].answers[aIndex] = value;
	}
	function updateCorrectAnswer(qIndex, aIndex, isChecked) {
		questions[qIndex].correctAnswers[aIndex] = isChecked;
	}
	function updateExplanation(index, value) {
		questions[index].explanation = value;
	}
	function saveProgress() {
		const quizData = getQuizData();
		localStorage.setItem("quizData", serializeQuiz(quizData));
		notify(t(32));
	}
	function importErrorMessage(err) {
		if (err instanceof UnsupportedSchemaVersionError) return t(39, { version: err.version });
		if (err instanceof QuizImportError) return `${t(38)} ${err.message}`;
		console.error(err);
		return t(38);
	}
	function applyImportedQuiz(text, successMsg) {
		try {
			const { data } = importQuiz(text);
			setQuizData(data);
			renderQuestions();
			notify(successMsg);
			return true;
		} catch (err) {
			notify(importErrorMessage(err));
			return false;
		}
	}
	function loadProgress() {
		const saved = localStorage.getItem("quizData");
		if (saved) applyImportedQuiz(saved, t(33));
		else notify(t(34));
	}
	function previewQuiz() {
		const previewContent = document.getElementById("previewContent");
		previewContent.innerHTML = `
    <h3>${escapeHTML(document.getElementById("quizTitle").value)}</h3>
    <p><strong>${t(4)}:</strong> ${escapeHTML(document.getElementById("teacherName").value)}</p>
    <p><strong>${t(8)}:</strong> ${escapeHTML(document.getElementById("quizDate").value)}</p>
    <p>${escapeHTML(document.getElementById("instructions").value)}</p>
    ${questions.map((q, i) => `
      <div>
        <h4>${t(23, { n: i + 1 })}</h4>
        <p>${escapeHTML(q.text)}</p>
        ${q.answers.map((a, j) => `<p style='margin-left:20px;'>${String.fromCharCode(65 + j)}. ${escapeHTML(a)}</p>`).join("")}
      </div>`).join("")}
  `;
		document.getElementById("previewModal").style.display = "block";
	}
	function closePreview() {
		document.getElementById("previewModal").style.display = "none";
	}
	function exportQuizData() {
		const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(serializeQuiz(getQuizData()));
		const a = document.createElement("a");
		a.setAttribute("href", dataStr);
		a.setAttribute("download", "quiz_data.json");
		document.body.appendChild(a);
		a.click();
		a.remove();
	}
	function importQuizData() {
		document.getElementById("importFileInput").click();
	}
	function handleFileImport(event) {
		const file = event.target.files[0];
		if (!file) {
			notify(t(36));
			return Promise.resolve(false);
		}
		const reader = new FileReader();
		const settled = new Promise((resolve) => {
			reader.onload = (e) => {
				resolve(applyImportedQuiz(e.target.result, t(37)));
				event.target.value = "";
			};
			reader.onerror = () => {
				notify(t(38));
				event.target.value = "";
				resolve(false);
			};
		});
		reader.readAsText(file);
		return settled;
	}
	function generateWordDocument() {
		let docContent = `
    <!DOCTYPE html>
    <html lang="${escapeHTML(getLocale())}">
    <head><meta charset="UTF-8"><title>${t(27)}</title></head><body>`;
		docContent += `
    <h2>${escapeHTML(document.getElementById("quizTitle").value)}</h2>
    <p><strong>${t(4)}:</strong> ${escapeHTML(document.getElementById("teacherName").value)}</p>
    <p><strong>${t(8)}:</strong> ${escapeHTML(document.getElementById("quizDate").value)}</p>
    <p>${escapeHTML(document.getElementById("instructions").value)}</p>`;
		questions.forEach((q, i) => {
			docContent += `
      <div>
        <h4>${t(23, { n: i + 1 })}</h4>
        <p>${escapeHTML(q.text)}</p>`;
			q.answers.forEach((a, idx) => {
				docContent += `<p style='margin-left:20px;'>${String.fromCharCode(65 + idx)}. ${escapeHTML(a)}</p>`;
			});
			docContent += `</div>`;
		});
		docContent += `</body></html>`;
		const blob = new Blob([docContent], { type: "application/msword" });
		const url = URL.createObjectURL(blob);
		const link = document.createElement("a");
		link.href = url;
		link.download = "quiz_document.doc";
		document.body.appendChild(link);
		link.click();
		document.body.removeChild(link);
	}
	function printAnswerSheet() {
		let content = `
    <!DOCTYPE html>
    <html lang="${escapeHTML(getLocale())}">
    <head><meta charset="UTF-8"><title>${t(28)}</title></head><body>`;
		content += `
    <h2>${t(29, { title: document.getElementById("quizTitle").value })}</h2>`;
		questions.forEach((q, i) => {
			content += `
      <div>
        <h4>${t(23, { n: i + 1 })}</h4>
        <p>${escapeHTML(q.text)}</p>`;
			q.answers.forEach((a, idx) => {
				content += `<p style='margin-left:20px;'>${String.fromCharCode(65 + idx)}. ${escapeHTML(a)} ${q.correctAnswers[idx] ? t(30) : ""}</p>`;
			});
			if (q.explanation) content += `<p><strong>${t(31)}:</strong> ${escapeHTML(q.explanation)}</p>`;
			content += `</div>`;
		});
		content += `</body></html>`;
		const blob = new Blob([content], { type: "application/msword" });
		const url = URL.createObjectURL(blob);
		const link = document.createElement("a");
		link.href = url;
		link.download = "answer_sheet.doc";
		document.body.appendChild(link);
		link.click();
		document.body.removeChild(link);
	}
	function shuffleQuestions() {
		for (let i = questions.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[questions[i], questions[j]] = [questions[j], questions[i]];
		}
		renderQuestions();
	}
	function shuffleAnswers() {
		questions.forEach((question) => {
			const withIdx = question.answers.map((a, i) => ({
				answer: a,
				idx: i
			}));
			for (let i = withIdx.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[withIdx[i], withIdx[j]] = [withIdx[j], withIdx[i]];
			}
			const shuffledAnswers = withIdx.map((o) => o.answer);
			const newCorrect = shuffledAnswers.map((a) => question.correctAnswers[withIdx.find((o) => o.answer === a).idx]);
			question.answers = shuffledAnswers;
			question.correctAnswers = newCorrect;
		});
		renderQuestions();
	}
	function clearQuiz() {
		questions = [];
		tags = {};
		document.getElementById("quizTitle").value = "";
		document.getElementById("teacherName").value = "";
		document.getElementById("instructions").value = "";
		document.getElementById("quizDate").value = "";
		renderQuestions();
		notify(t(35));
	}
	if (typeof window !== "undefined") Object.assign(window, {
		addQuestion,
		saveProgress,
		loadProgress,
		previewQuiz,
		exportQuizData,
		importQuizData,
		generateWordDocument,
		printAnswerSheet,
		shuffleQuestions,
		shuffleAnswers,
		clearQuiz,
		handleFileImport,
		closePreview,
		removeQuestion,
		updateQuestionText,
		updateAnswer,
		updateCorrectAnswer,
		updateExplanation
	});
	if (typeof document !== "undefined") {
		const importBtn = document.getElementById("importBtn");
		if (importBtn) importBtn.addEventListener("click", importQuizData);
		initI18n();
		mountLanguageSwitcher();
		onLocaleChange(() => {
			if (questions.length > 0) renderQuestions();
		});
	}
})();</script>
  </body>
</html>
