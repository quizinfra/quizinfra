name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build single-file site (outputs to docs/)
        run: npm run build

      - name: Verify committed docs/ artifact matches the build
        run: |
          if ! test -z "$(git status --porcelain -- docs/)"; then
            echo "::error::docs/ does not match a fresh build of the sources."
            echo "Run 'npm run build' locally and commit the regenerated docs/index.html in the same commit (the pre-commit hook does this automatically). Do not hand-merge docs/index.html; regenerate it." >&2
            git --no-pager diff --stat -- docs/
            git --no-pager status --porcelain -- docs/
            exit 1
          fi
          echo "docs/ artifact matches the build."
